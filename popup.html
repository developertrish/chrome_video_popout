<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Pop Out</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <div class="eyebrow">YOUTUBE TOOL</div>
    <h1>Pop out the video</h1>
    <p id="status">Open the active video in a movable, resizable PiP window.</p>
    <button id="open" type="button"><span aria-hidden="true">↗</span> Open pop-out</button>
    <p class="hint">Hover the PiP window for play, pause, seek, and volume controls.</p>
  </main>
</body>
</html>
